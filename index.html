<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgendaU· Tareas y compromisos universitarios a tu organización</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="side">
    <h1 class="brand">AgendaU</h1>
    <nav class="nav" aria-label="Vistas">
      <button data-view="list" class="on">Lista</button>
      <button data-view="week">Semana</button>
      <button data-view="month">Mes</button>
    </nav>
    <button class="btn primary wide" id="newTask">Nueva tarea</button>
    <!-- <div class="side-tools">
      <button class="link" id="enableNotif">Activar notificaciones</button>
      <button class="link" id="exportBtn">Exportar copia (JSON)</button>
      <label class="link">Importar copia<input type="file" id="importFile" accept="application/json" hidden></label>
    </div> -->
  </aside>

  <main class="main">
    <section class="load" aria-label="Carga de los próximos 7 días">
      <h2>Tu carga de la semana</h2>
      <div class="bars" id="loadBars"></div>
    </section>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Buscar por título, materia o nota" aria-label="Buscar">
      <select id="fType" aria-label="Filtrar por tipo"><option value="">Todos los tipos</option></select>
      <select id="fPrio" aria-label="Filtrar por prioridad">
        <option value="">Toda prioridad</option><option>alta</option><option>media</option><option>baja</option>
      </select>
    </div>

    <div class="cal-nav" id="calNav" hidden>
      <button class="btn" id="prev" aria-label="Anterior">‹</button>
      <strong id="calTitle"></strong>
      <button class="btn" id="next" aria-label="Siguiente">›</button>
      <button class="btn" id="today">Hoy</button>
    </div>

    <div id="view"></div>
  </main>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlgTitle">Nueva tarea</h2>
      <label>Título<input name="title" required maxlength="120"></label>
      <div class="row">
        <label>Tipo<select name="type"></select></label>
        <label>Materia<input name="subject" maxlength="60" placeholder="Ej. Investigación de operaciones"></label>
      </div>
      <div class="row">
        <label>Fecha<input type="date" name="date" required></label>
        <label>Hora<input type="time" name="time" value="23:59"></label>
      </div>
      <div class="row">
        <label>Prioridad
          <select name="priority"><option value="alta">Alta</option><option value="media" selected>Media</option><option value="baja">Baja</option></select>
        </label>
        <label>Avisarme
          <select name="remind">
            <option value="-1">No avisar</option>
            <option value="10">10 minutos antes</option>
            <option value="60" selected>1 hora antes</option>
            <option value="180">3 horas antes</option>
            <option value="1440">1 día antes</option>
            <option value="2880">2 días antes</option>
            <option value="10080">1 semana antes</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Repetir
          <select name="repeat">
            <option value="none">No se repite</option><option value="daily">Cada día</option>
            <option value="weekly">Cada semana</option><option value="biweekly">Cada 2 semanas</option>
            <option value="monthly">Cada mes</option>
          </select>
        </label>
        <label>Compañeros (grupal)<input name="group" maxlength="120" placeholder="Ej. Ana, Luis, Sofía"></label>
      </div>
      <label>Información adicional<textarea name="notes" rows="3" placeholder="Enlaces, capítulos, qué entregar, criterios…"></textarea></label>
      <div class="actions">
        <button type="button" class="btn danger" id="delBtn" hidden>Eliminar</button>
        <span class="grow"></span>
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button class="btn primary" type="submit">Guardar tarea</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
